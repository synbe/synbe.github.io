<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assets Index</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 720px; width: 100%; }
    header {
      margin-bottom: 2rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      margin-top: 0.3rem;
      font-size: 0.85rem;
      color: #86868b;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, box-shadow 0.15s;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .item:hover {
      background: #e8e8ed;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .item .idx { font-size: 0.82rem; color: #c7c7cc; min-width: 1.8rem; text-align: right; font-variant-numeric: tabular-nums; }
    .item .info { flex: 1; min-width: 0; }
    .item .name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .meta {
      font-size: 0.78rem;
      color: #86868b;
      margin-top: 0.1rem;
    }
    .item .size { flex-shrink: 0; font-size: 0.82rem; color: #86868b; }
    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: #86868b;
    }
    @media (max-width: 480px) {
      body { padding: 1rem 0.6rem; }
      header h1 { font-size: 1.3rem; }
      .item { padding: 0.6rem 0.75rem; border-radius: 10px; }
    }
  </style>
</head>
<body>

  </div>
  <footer>

</div>
</body>
</html>
