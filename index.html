<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Index</title>
    
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #eef2ff;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #f72585;
            --light: #f8f9fa;
            --dark: #2d3748;
            --gray: #718096;
            --gray-light: #e2e8f0;
            --gray-dark: #4a5568;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border-radius: 5px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 浅色主题 */
        body[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --hover-bg: #f1f5f9;
        }
        
        /* 深色主题 */
        body[data-theme="dark"] {
            --bg-primary: #1e293b;
            --bg-secondary: #0f172a;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #334155;
            --card-bg: #334155;
            --hover-bg: #2d3748;
        }
        
        /* 自动主题使用系统设置 */
        @media (prefers-color-scheme: dark) {
            body:not([data-theme]) {
                --bg-primary: #1e293b;
                --bg-secondary: #0f172a;
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --border-color: #334155;
                --card-bg: #334155;
                --hover-bg: #2d3748;
            }
        }
        
        @media (prefers-color-scheme: light) {
            body:not([data-theme]) {
                --bg-primary: #ffffff;
                --bg-secondary: #f8fafc;
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --border-color: #e2e8f0;
                --card-bg: #ffffff;
                --hover-bg: #f1f5f9;
            }
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-secondary);
            transition: var(--transition);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        /* 头部样式 */
        .page-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            padding: 1rem;
            margin: 0;
            box-shadow: var(--shadow-lg);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }
        
        /* 信息栏响应式布局 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .info-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        
        .info-right {
            display: flex;
            align-items: center;
        }
        
        .date-info, .count-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
        
        .desktop-text {
            display: inline;
        }
        
        .mobile-text {
            display: none;
        }
        
        .icon {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
            flex-shrink: 0;
        }
        
        /* 控制栏 */
        .controls {
            display: flex;
            gap: 0.75rem;
            flex-wrap: nowrap;
        }
        
        .control-group {
            display: flex;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            min-width: 100px;
            white-space: nowrap;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .control-label {
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        /* 主内容区 */
        .main-content {
            padding: 1rem 0;
        }
        
        .content-view {
            display: none;
        }
        
        .content-view.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        .empty-message {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 响应式设计 - 中等屏幕 (平板) */
        @media (max-width: 1024px) {
            .container {
                padding: 0 1.25rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .info-bar {
                padding: 0.75rem;
                gap: 0.75rem;
            }
            
            .info-left {
                gap: 1rem;
            }
            
            .controls {
                gap: 0.5rem;
            }
            
            .control-btn {
                min-width: 90px;
                padding: 0.5rem 0.75rem;
            }
        }
        
        /* 响应式设计 - 小屏幕 (平板竖屏/大手机) */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            .page-header {
                margin: 0 -1rem 1.5rem -1rem;
                padding: 1.5rem 1rem;
                border-radius: 0;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .info-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1rem;
            }
            
            .info-left {
                justify-content: space-between;
                gap: 0.5rem;
            }
            
            .date-info, .count-info {
                font-size: 0.9rem;
            }
            
            .controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .control-group {
                flex: 1;
            }
            
            .control-btn {
                min-width: 0;
                width: 100%;
                padding: 0.75rem;
            }
            
            .desktop-text {
                display: none;
            }
            
            .mobile-text {
                display: inline;
            }
            
            /* 网格视图调整 */
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 0.75rem;
            }
        }
        
        /* 响应式设计 - 超小屏幕 (手机) */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .info-bar {
                padding: 0.75rem;
                gap: 0.75rem;
            }
            
            .info-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
                width: 100%;
            }
            
            .date-info, .count-info {
                width: 100%;
                justify-content: space-between;
            }
            
            .controls {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .control-group {
                width: 100%;
            }
            
            .control-btn {
                padding: 0.5rem;
                justify-content: flex-start;
            }
            
            /* 列表视图调整 */
            .directory-header {
                padding: 0.75rem;
            }
            
            .directory-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            
            .cover-preview,
            .cover-placeholder {
                align-self: flex-start;
            }
            
            /* 网格视图调整 */
            .card-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .card-cover {
                height: 180px;
            }
        }
        
        /* 响应式设计 - 极小屏幕 (小手机) */
        @media (max-width: 360px) {
            .container {
                padding: 0 0.75rem;
            }
            
            .page-header {
                padding: 1rem 0.75rem;
            }
            
            .info-bar {
                padding: 0.5rem;
            }
            
            .control-btn {
                padding: 0.5rem 0.25rem;
            }
            
            .control-label {
                font-size: 0.85rem;
            }
            
            .card-cover {
                height: 150px;
            }
        }
        
        /* 列表视图样式 */
        .directory-list {
            background: var(--bg-primary);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        
        .directory-item {
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            outline: none;
        }
        
        .directory-item:hover,
        .directory-item:focus {
            background-color: var(--hover-bg);
        }
        
        .directory-item[data-has-index="true"]:hover,
        .directory-item[data-has-index="true"]:focus {
            box-shadow: inset 0 0 0 2px var(--primary);
        }
        
        .directory-item:last-child {
            border-bottom: none;
        }
        
        .directory-header {
            display: flex;
            align-items: center;
            padding: 1rem;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            margin-right: 0.5rem;
            border-radius: 5px;
            z-index: 10;
        }
        
        .toggle-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .toggle-btn.empty {
            visibility: hidden;
        }
        
        .directory-item.expanded .toggle-btn svg {
            transform: rotate(90deg);
        }
        
        .directory-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }
        
        .cover-preview {
            width: 3rem;
            height: 3rem;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        
        .cover-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cover-placeholder {
            width: 3rem;
            height: 3rem;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }
        
        .directory-info {
            flex: 1;
        }
        
        .directory-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        
        .directory-path {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Consolas', monospace;
        }
        
        .directory-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 5px;
            display: inline-block;
        }
        
        .status-indicator.has-index {
            background-color: var(--success);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }
        
        .status-indicator.no-index {
            background-color: var(--gray);
            box-shadow: 0 0 0 2px rgba(113, 128, 150, 0.3);
        }
        
        .directory-sublist {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: var(--bg-secondary);
        }
        
        .directory-item[data-level="1"] .directory-header {
            padding-left: 3rem;
        }
        
        .directory-item[data-level="2"] .directory-header {
            padding-left: 4.5rem;
        }
        
        .directory-item[data-level="3"] .directory-header {
            padding-left: 6rem;
        }
        
        /* 卡片视图样式 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .card-item {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            outline: none;
        }
        
        .card-item:hover,
        .card-item:focus {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .card-item[data-has-index="true"]:hover,
        .card-item[data-has-index="true"]:focus {
            border-color: var(--primary);
        }
        
        .card-cover {
            position: relative;
            overflow: hidden;
            height: 200px;
        }
        
        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        
        .card-item:hover .card-cover img {
            transform: scale(1.05);
        }
        
        .cover-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-grid .cover-placeholder {
            width: 100%;
        }
        .cover-placeholder .icon {
            width: 3rem;
            height: 3rem;
            color: white;
        }
        
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 1rem;
            opacity: 0;
            transition: var(--transition);
        }
        
        .card-item:hover .card-overlay {
            opacity: 1;
        }
        
        .subdir-count {
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark);
            padding: 0.1rem 0.5rem;
            border-radius: 5px;
            font-size: 0.875rem;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 5px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status-badge.has-index {
            background-color: var(--success);
            color: white;
            border-radius: 5px;
            width: 2px;
        }
        
        .status-badge.no-index {
            background-color: var(--gray);
            color: white;
            border-radius: 50%;
            width: 0.2rem;
        }
        
        .card-content {
            padding: 1rem 1.25rem;
            position: relative;
        }
        
        .card-info {
            flex: 1;
        }
        
        .card-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 1.1rem;
        }
        
        .card-path {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Consolas', monospace;
        }
        
        .subdir-toggle-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            border-radius: 5px;
            z-index: 10;
        }
        
        .subdir-toggle-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .card-item.subdirs-expanded .subdir-toggle-btn svg {
            transform: rotate(180deg);
        }
        
        .card-subdirs {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-top: 1px solid var(--border-color);
            padding: 0;
            background: var(--bg-secondary);
        }
        
        .card-item.subdirs-expanded .card-subdirs {
            padding: 1rem;
        }
        
        .subdir-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 5px;
            transition: var(--transition);
            cursor: pointer;
            outline: none;
            margin-bottom: 0.25rem;
        }
        
        .subdir-item:last-child {
            margin-bottom: 0;
        }
        
        .subdir-item:hover {
            background: var(--bg-primary);
        }
        
        .subdir-item[data-has-index="true"]:hover {
            box-shadow: inset 0 0 0 1px var(--primary);
        }
        
        .subdir-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .subdir-toggle-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
            font-weight: 500;
        }
        .subdir-name {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .more-subdirs {
            text-align: center;
            padding: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-style: italic;
        }
        
        /* 页脚 */
        .page-footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }
        
        .footer-info {
            margin-top: 1rem;
            font-size: 0.875rem;
            opacity: 0.7;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="header-content">
                <h1>Index</h1>
                <p class="subtitle">包含index.html的目录浏览</p>
                
                <div class="info-bar">
                    <div class="info-left">
                        <div class="date-info">
                            <svg class="icon"><use href="#icon-calendar"></use></svg>
                            <span class="desktop-text">更新: 2026-06-23 15:32:27</span>

                        </div>
                        <div class="count-info">
                            <svg class="icon"><use href="#icon-folder"></use></svg>
                            <span class="desktop-text">有效目录: <span id="dir-count">2</span></span>
                            <span class="mobile-text"><span id="dir-count-mobile">2</span> 个</span>
                        </div>
                    </div>
                    
                    <div class="info-right">
                        <div class="controls">
                            <div class="control-group">
                                <button class="control-btn" id="view-toggle" title="切换视图">

                                    <span class="control-label desktop-text">列表</span>
                                    <span class="control-label mobile-text">视图</span>
                                </button>
                            </div>
                            
                            <div class="control-group">
                                <button class="control-btn" id="theme-toggle" title="切换主题">
                                    <svg class="icon"><use href="#icon-moon"></use></svg>
                                    <span class="control-label desktop-text">深色</span>
                                    <span class="control-label mobile-text">主题</span>
                                </button>
                            </div>
                            
                            <div class="control-group">
                                <button class="control-btn" id="expand-toggle" title="展开/折叠所有">
                                    <svg class="icon"><use href="#icon-expand"></use></svg>
                                    <span class="control-label desktop-text">展开</span>
                                    <span class="control-label mobile-text">折叠</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </header>
        
        <main class="main-content">
            <div class="content-view list-view active" id="list-view">
                <div class="directory-list">
        <div class="directory-item" data-has-subs="false" data-has-index="true" data-path="ablums/uploadfiles" data-level="0" tabindex="0">
            <div class="directory-header">
                <span class="toggle-btn empty"></span>
                <div class="directory-content">
                    
    <div class="cover-placeholder" style="background-color: #b58928;">
        <svg class="icon"><use href="#icon-folder"></use></svg>
    </div>
    
                    <div class="directory-info">
                        <h3 class="directory-name">uploadfiles</h3>
                        <p class="directory-path">/uploadfiles</p>
                    </div>
                </div>
                <div class="directory-actions">
                    <span class="status-indicator has-index" title="点击跳转到index.html"></span>
                </div>
            </div>
        </div>
        <div class="directory-item" data-has-subs="false" data-has-index="true" data-path="ablums/wavemessenger" data-level="0" tabindex="0">
            <div class="directory-header">
                <span class="toggle-btn empty"></span>
                <div class="directory-content">
                    
    <div class="cover-placeholder" style="background-color: #13c302;">
        <svg class="icon"><use href="#icon-folder"></use></svg>
    </div>
    
                    <div class="directory-info">
                        <h3 class="directory-name">wavemessenger</h3>
                        <p class="directory-path">/wavemessenger</p>
                    </div>
                </div>
                <div class="directory-actions">
                    <span class="status-indicator has-index" title="点击跳转到index.html"></span>

    <script>
        // 目录结构数据
        const albumsStructure = [{"name": "uploadfiles", "path": "ablums/uploadfiles", "has_index": true, "subdirs": [], "has_subdirs": false, "cover": null, "color": "#b58928"}, {"name": "wavemessenger", "path": "ablums/wavemessenger", "has_index": true, "subdirs": [], "has_subdirs": false, "cover": null, "color": "#13c302"}];
        
        // 状态变量
        let currentView = 'list'; // 'list' 或 'grid'
        let currentTheme = 'dark'; // 'light', 'dark', 'auto'
        let isAllExpanded = false;
        
        // 初始化函数
        document.addEventListener('DOMContentLoaded', function() {
            initControls();
            initKeyboardNavigation();
            updateStats();
            
            // 从本地存储恢复设置
            restoreSettings();
            
            // 更新移动端计数显示
            updateMobileStats();
        });
        
        // 初始化控制功能
        function initControls() {
            // 视图切换按钮
            const viewToggle = document.getElementById('view-toggle');
            viewToggle.addEventListener('click', function() {
                toggleView();
            });
            
            // 主题切换按钮
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', function() {
                toggleTheme();
            });
            
            // 展开/折叠切换按钮
            const expandToggle = document.getElementById('expand-toggle');
            expandToggle.addEventListener('click', function() {
                toggleExpandAll();
            });
            
            // 折叠/展开按钮事件委托
            document.addEventListener('click', function(e) {
                if (e.target.closest('.toggle-btn')) {
                    const toggleBtn = e.target.closest('.toggle-btn');
                    const item = toggleBtn.closest('.directory-item');
                    toggleDirectory(item);
                    e.stopPropagation(); // 防止触发目录跳转
                }
                
                // 卡片视图子目录折叠/展开按钮
                if (e.target.closest('.subdir-toggle-btn')) {
                    const toggleBtn = e.target.closest('.subdir-toggle-btn');
                    const cardItem = toggleBtn.closest('.card-item');
                    toggleCardSubdirs(cardItem);
                    e.stopPropagation();
                }
            });
            
            // 目录项点击跳转
            document.addEventListener('click', function(e) {
                // 查找最近的目录项
                const directoryItem = e.target.closest('.directory-item');
                const cardContent = e.target.closest('.card-content');
                const cardCover = e.target.closest('.card-cover');
                const subdirItem = e.target.closest('.subdir-item');
                const subdirItemInList = e.target.closest('.directory-sublist .subdir-item');
                
                if (directoryItem && !e.target.closest('.toggle-btn') && !e.target.closest('.directory-actions')) {
                    const hasIndex = directoryItem.getAttribute('data-has-index') === 'true';
                    if (hasIndex) {
                        const path = directoryItem.getAttribute('data-path');
                        window.open('./' + path + '/index.html', '_blank');
                    }
                }
                
                // 卡片内容区域或封面区域点击跳转
                if ((cardContent || cardCover) && !e.target.closest('.subdir-item') && !e.target.closest('.subdir-toggle-btn')) {
                    // 获取卡片元素
                    const cardItem = (cardContent || cardCover).closest('.card-item');
                    const hasIndex = cardItem.getAttribute('data-has-index') === 'true';
                    if (hasIndex) {
                        const path = cardItem.getAttribute('data-path');
                        window.open('./' + path + '/index.html', '_blank');
                    }
                }
                
                // 卡片视图中的子目录点击
                if (subdirItem && !subdirItemInList) {
                    const hasIndex = subdirItem.getAttribute('data-has-index') === 'true';
                    if (hasIndex) {
                        const path = subdirItem.getAttribute('data-path');
                        window.open('./' + path + '/index.html', '_blank');
                    }
                }
            });
        }
        
        // 切换视图
        function toggleView() {
            const viewToggle = document.getElementById('view-toggle');
            const viewIcon = viewToggle.querySelector('.icon use');
            const desktopLabel = viewToggle.querySelector('.control-label.desktop-text');
            const mobileLabel = viewToggle.querySelector('.control-label.mobile-text');
            
            if (currentView === 'list') {
                currentView = 'grid';
                switchView('grid');
                viewIcon.setAttribute('href', '#icon-grid');
                desktopLabel.textContent = '卡片';
                mobileLabel.textContent = '卡片';
            } else {
                currentView = 'list';
                switchView('list');
                viewIcon.setAttribute('href', '#icon-list');
                desktopLabel.textContent = '列表';
                mobileLabel.textContent = '列表';
            }
            localStorage.setItem('preferred-view', currentView);
        }
        
        // 切换主题
        function toggleTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = themeToggle.querySelector('.icon use');
            const desktopLabel = themeToggle.querySelector('.control-label.desktop-text');
            const mobileLabel = themeToggle.querySelector('.control-label.mobile-text');
            
            const themes = ['light', 'dark'];
            const icons = ['#icon-sun', '#icon-moon'];
            const desktopLabels = ['浅色', '深色'];
            const mobileLabels = ['浅色', '深色'];
            
            const currentIndex = themes.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            
            currentTheme = themes[nextIndex];
            switchTheme(currentTheme);
            
            themeIcon.setAttribute('href', icons[nextIndex]);
            desktopLabel.textContent = desktopLabels[nextIndex];
            mobileLabel.textContent = mobileLabels[nextIndex];
            
            localStorage.setItem('preferred-theme', currentTheme);
        }
        
        // 切换展开/折叠所有
        function toggleExpandAll() {
            const expandToggle = document.getElementById('expand-toggle');
            const expandIcon = expandToggle.querySelector('.icon use');
            const desktopLabel = expandToggle.querySelector('.control-label.desktop-text');
            const mobileLabel = expandToggle.querySelector('.control-label.mobile-text');
            
            if (isAllExpanded) {
                collapseAll();
                expandIcon.setAttribute('href', '#icon-expand');
                desktopLabel.textContent = '展开';
                mobileLabel.textContent = '展开';
            } else {
                expandAll();
                expandIcon.setAttribute('href', '#icon-collapse');
                desktopLabel.textContent = '折叠';
                mobileLabel.textContent = '折叠';
            }
            isAllExpanded = !isAllExpanded;
        }
        
        // 切换视图
        function switchView(view) {
            document.querySelectorAll('.content-view').forEach(el => el.classList.remove('active'));
            document.getElementById(view + '-view').classList.add('active');
            document.body.setAttribute('data-view', view);
        }
        
        // 切换主题
        function switchTheme(theme) {
            if (theme === 'auto') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', theme);
            }
        }
        
        // 展开所有目录
        function expandAll() {
            document.querySelectorAll('.directory-item').forEach(item => {
                item.classList.add('expanded');
                const sublist = item.querySelector('.directory-sublist');
                if (sublist) sublist.style.maxHeight = sublist.scrollHeight + 'px';
            });
            
            // 展开所有卡片视图的子目录
            document.querySelectorAll('.card-item').forEach(item => {
                item.classList.add('subdirs-expanded');
                const sublist = item.querySelector('.card-subdirs');
                if (sublist) sublist.style.maxHeight = sublist.scrollHeight + 'px';
            });
            updateStats();
            updateMobileStats();
        }
        
        // 折叠所有目录
        function collapseAll() {
            document.querySelectorAll('.directory-item').forEach(item => {
                item.classList.remove('expanded');
                const sublist = item.querySelector('.directory-sublist');
                if (sublist) sublist.style.maxHeight = '0';
            });
            
            // 折叠所有卡片视图的子目录
            document.querySelectorAll('.card-item').forEach(item => {
                item.classList.remove('subdirs-expanded');
                const sublist = item.querySelector('.card-subdirs');
                if (sublist) sublist.style.maxHeight = '0';
            });
            updateStats();
            updateMobileStats();
        }
        
        // 切换单个目录的展开状态
        function toggleDirectory(item) {
            const isExpanded = item.classList.contains('expanded');
            const sublist = item.querySelector('.directory-sublist');
            
            if (isExpanded) {
                item.classList.remove('expanded');
                if (sublist) sublist.style.maxHeight = '0';
            } else {
                item.classList.add('expanded');
                if (sublist) sublist.style.maxHeight = sublist.scrollHeight + 'px';
            }
            updateStats();
            updateMobileStats();
        }
        
        // 切换卡片视图子目录的展开状态
        function toggleCardSubdirs(cardItem) {
            const isExpanded = cardItem.classList.contains('subdirs-expanded');
            const sublist = cardItem.querySelector('.card-subdirs');
            const toggleBtn = cardItem.querySelector('.subdir-toggle-btn');
            
            if (isExpanded) {
                cardItem.classList.remove('subdirs-expanded');
                if (sublist) sublist.style.maxHeight = '0';
                if (toggleBtn) {
                    toggleBtn.innerHTML = '<svg class="icon"><use href="#icon-chevron-right"></use></svg><span class="subdir-toggle-count">' + (cardItem.querySelector('.subdir-toggle-count')?.textContent || '') + '</span>';
                }
            } else {
                cardItem.classList.add('subdirs-expanded');
                if (sublist) sublist.style.maxHeight = sublist.scrollHeight + 'px';
                if (toggleBtn) {
                    toggleBtn.innerHTML = '<svg class="icon"><use href="#icon-collapse"></use></svg><span class="subdir-toggle-count">' + (cardItem.querySelector('.subdir-toggle-count')?.textContent || '') + '</span>';
                }
            }
        }
        
        // 更新统计信息
        function updateStats() {
            const expandedCount = document.querySelectorAll('.directory-item.expanded').length;
            const totalCount = document.querySelectorAll('.directory-item[data-has-subs="true"]').length;
            const allCount = document.querySelectorAll('.directory-item').length;
            document.getElementById('dir-count').textContent = allCount + ' (' + expandedCount + '/' + totalCount + ' 展开)';
        }
        
        // 更新移动端统计信息
        function updateMobileStats() {
            const expandedCount = document.querySelectorAll('.directory-item.expanded').length;
            const totalCount = document.querySelectorAll('.directory-item[data-has-subs="true"]').length;
            const allCount = document.querySelectorAll('.directory-item').length;
            document.getElementById('dir-count-mobile').textContent = allCount + ' (' + expandedCount + '/' + totalCount + ')';
        }
        
        // 从本地存储恢复设置
        function restoreSettings() {
            // 恢复视图设置
            const savedView = localStorage.getItem('preferred-view');
            if (savedView) {
                currentView = savedView;
                switchView(savedView);
                const viewToggle = document.getElementById('view-toggle');
                const viewIcon = viewToggle.querySelector('.icon use');
                const desktopLabel = viewToggle.querySelector('.control-label.desktop-text');
                const mobileLabel = viewToggle.querySelector('.control-label.mobile-text');
                
                if (savedView === 'grid') {
                    viewIcon.setAttribute('href', '#icon-grid');
                    desktopLabel.textContent = '卡片';
                    mobileLabel.textContent = '卡片';
                } else {
                    viewIcon.setAttribute('href', '#icon-list');
                    desktopLabel.textContent = '列表';
                    mobileLabel.textContent = '列表';
                }
            }
            
            // 恢复主题设置
            const savedTheme = localStorage.getItem('preferred-theme');
            if (savedTheme) {
                currentTheme = savedTheme;
                switchTheme(savedTheme);
                const themeToggle = document.getElementById('theme-toggle');
                const themeIcon = themeToggle.querySelector('.icon use');
                const desktopLabel = themeToggle.querySelector('.control-label.desktop-text');
                const mobileLabel = themeToggle.querySelector('.control-label.mobile-text');
                
                const themes = ['light', 'dark'];
                const icons = ['#icon-sun', '#icon-moon'];
                const desktopLabels = ['浅色', '深色'];
                const mobileLabels = ['浅色', '深色'];
                
                const index = themes.indexOf(savedTheme);
                if (index !== -1) {
                    themeIcon.setAttribute('href', icons[index]);
                    desktopLabel.textContent = desktopLabels[index];
                    mobileLabel.textContent = mobileLabels[index];
                }
            }
        }
        
        // 键盘导航
        function initKeyboardNavigation() {
            document.addEventListener('keydown', function(e) {
                const activeElement = document.activeElement;
                const isInput = activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA';
                
                if (isInput) return;
                
                switch(e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        if (activeElement.closest('.directory-item')) {
                            const item = activeElement.closest('.directory-item');
                            if (!item.classList.contains('expanded')) {
                                toggleDirectory(item);
                            }
                        }
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (activeElement.closest('.directory-item')) {
                            const item = activeElement.closest('.directory-item');
                            if (item.classList.contains('expanded')) {
                                toggleDirectory(item);
                            }
                        }
                        break;
                    case ' ':
                        e.preventDefault();
                        if (activeElement.closest('.directory-item')) {
                            const item = activeElement.closest('.directory-item');
                            toggleDirectory(item);
                        }
                        break;
                    case 'Enter':
                        e.preventDefault();
                        // 回车键打开当前选中的目录
                        const activeItem = document.querySelector('.directory-item:focus');
                        if (activeItem) {
                            const hasIndex = activeItem.getAttribute('data-has-index') === 'true';
                            if (hasIndex) {
                                const path = activeItem.getAttribute('data-path');
                                window.open('./' + path + '/index.html', '_blank');
                            }
                        }
                        break;
                    case 'Escape':
                        // 折叠当前目录
                        const expandedItem = document.querySelector('.directory-item.expanded');
                        if (expandedItem) {
                            toggleDirectory(expandedItem);
                        }
                        break;
                }
            });
        }
    </script>
