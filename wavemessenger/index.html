<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1d232a">
  <title>WaveMessenger</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --tg-bg: #353a3f; --tg-bg-chat: #0f0f0f; --tg-header: #1d232a;
  --tg-input: #232e3a; --tg-text: #ffffff; --tg-text-secondary: #7f91a4;
  --tg-green: #4ade80; --tg-green-bg: rgba(74, 222, 128, 0.1);
  --tg-blue: #60a5fa; --tg-blue-bg: rgba(96, 165, 250, 0.1);
  --tg-red: #f87171; --tg-divider: #2b3544;
}
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--tg-bg); color: var(--tg-text); height: 100vh; }
.app { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; position: relative; border: 1px var(--tg-green) solid;}
.header { background: var(--tg-header); padding: 5px 10px; border-bottom: 1px solid var(--tg-divider); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-title { font-size: 18px; font-weight: 600; }
.header-status { font-size: 12px; color: var(--tg-text-secondary); display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 5px; background: var(--tg-text-secondary); }
.status-dot.listening { background: var(--tg-red); animation: pulse 1.5s infinite; }
.status-dot.audio-ready { background: var(--tg-green); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.header-right { display: flex; gap: 8px; }
.icon-btn {
  width: auto; height: 36px; padding: 0 12px; background: var(--tg-input); border: none;
  border-radius: 5px; color: var(--tg-text); cursor: pointer; font-size: 14px;
}
.icon-btn:hover { background: var(--tg-divider); }
.icon-btn.active { background: var(--tg-green-bg); color: var(--tg-green); }
.chat-area { flex: 1; overflow-y: auto; padding: 5px; background: var(--tg-bg-chat); display: flex; flex-direction: column; gap: 12px; }
.message { display: flex; gap: 8px; max-width: 85%; align-items: flex-start; }
.message.sent { flex-direction: row-reverse; align-self: flex-end; }
.message.received { flex-direction: row; align-self: flex-start; }
.message-avatar {
  width: 36px; height: 36px; border-radius: 5px; background: var(--tg-input);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.message-avatar.sent { background: var(--tg-green-bg); color: var(--tg-green); }
.message-avatar.received { background: var(--tg-blue-bg); color: var(--tg-blue); }
.message-content { display: flex; flex-direction: column; gap: 4px; }
.message-bubble {
  background: var(--tg-input); border-radius: 5px; padding: 10px 14px;
  position: relative; word-wrap: break-word; word-break: break-word; overflow-wrap: break-word; max-width: 100%;
}
.message.sent .message-bubble { background: var(--tg-green-bg); color: var(--tg-text); }
.message.sent .message-bubble::after {
  content: ""; position: absolute; right: -6px; top: 12px;
  border: 6px solid transparent; border-left-color: var(--tg-green-bg);
}
.message.received .message-bubble::after {
  content: ""; position: absolute; left: -6px; top: 12px;
  border: 6px solid transparent; border-right-color: var(--tg-input);
}
.message-time { font-size: 11px; color: var(--msg-time, var(--tg-text-secondary)); margin-bottom: 6px; }
.message-copy-btn {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  background: var(--tg-divider); border: none; border-radius: 5px;
  color: var(--tg-text-secondary); cursor: pointer; font-size: 5px; padding: 0;
}
.message-seq-badge {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  font-size: 10px; background: var(--tg-blue-bg); color: var(--tg-blue);
  padding: 2px 6px; border-radius: 5px; white-space: nowrap;
}
.message.sent .message-seq-badge { background: var(--tg-green-bg); color: var(--tg-green); }
.message-merged-badge {
  font-size: 10px; background: var(--tg-green-bg); color: var(--tg-green);
  padding: 2px 6px; border-radius: 5px; margin-bottom: 4px; display: inline-block;
}
.message-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
.message-merged-link {
  color: var(--tg-blue); cursor: pointer; text-decoration: underline;
  font-size: 12px; margin-top: 4px;
}
.input-area {
  background: var(--tg-header); padding: 5px 10px; border-top: 1px solid var(--tg-divider); flex-shrink: 0;
}
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-wrapper {
  flex: 1; background: var(--tg-input); border-radius: 5px; padding: 8px 12px;
  display: flex; align-items: flex-end; gap: 8px;
}
textarea {
  width: 100%; max-height: 100px; min-height: 36px; background: none;
  border: none; color: var(--tg-text); font-size: 15px; resize: none; font-family: inherit;
}
textarea::placeholder { color: var(--tg-text-secondary); }
.action-btn {
  padding: 6px 10px; background: var(--tg-divider); border: none;
  border-radius: 5px; color: var(--tg-text-secondary);  cursor: pointer;font-size: 18px;
}
.action-btn:hover { background: var(--tg-input); color: var(--tg-text); }
.paste-btn {
  width: 80px; height: 50px; border: none; border-radius: 5px;
  background: var(--tg-divider); color: var(--tg-text-secondary);  cursor: pointer;font-size: 18px;
}
.paste-btn:hover { background: var(--tg-input); color: var(--tg-text); }
.send-btn {
  width: 100px; height: 50px; border: none; border-radius: 5px;
  background: var(--tg-green); color: white; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.send-btn:hover { background: #22c55e; }
.empty-state {
  text-align: center; color: var(--tg-text-secondary); padding: 40px 20px;
}

/* Modal styles */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--tg-header); width: 90%; max-width: 600px; max-height: 80vh;
  border-radius: 5px; display: flex; flex-direction: column;
}
.modal-header {
  padding: 16px; border-bottom: 1px solid var(--tg-divider);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  width: 32px; height: 32px; border: none; background: var(--tg-divider);
  border-radius: 5px; color: var(--tg-text); cursor: pointer; font-size: 18px;
}
.modal-body {
  flex: 1; overflow-y: auto; padding: 16px;
}
.modal-text {
  background: var(--tg-input); padding: 16px; border-radius: 5px;
  white-space: pre-wrap; word-wrap: break-word; word-break: break-word;
  font-size: 14px; line-height: 1.6;
}
.modal-footer {
  padding: 16px; border-top: 1px solid var(--tg-divider);
  display: flex; gap: 8px; justify-content: flex-end;
}
.modal-btn {
  padding: 8px 16px; border: none; border-radius: 5px;
  font-size: 14px; cursor: pointer;
}
.modal-btn-copy { background: var(--tg-green); color: white; }
.modal-btn-download { background: var(--tg-blue-bg); color: var(--tg-blue); }
.modal-btn:hover { opacity: 0.9; }
.chunk-badge {
  background: var(--tg-blue-bg); color: var(--tg-blue);
  padding: 2px 8px; border-radius: 5px; font-size: 11px;
  margin-bottom: 8px; display: inline-block;
}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="header-title">WaveMessenger</div>
        <div class="header-status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">未启动</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="autoSaveBtn">保存日志: 关</button>
        <button class="icon-btn" id="listenBtn">监听</button>
      </div>
    </header>
    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div>数据传输</div>
        <div style="font-size: 14px; margin-top: 8px;">进入监听模式后，可通过声音发送和接收消息</div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <button class="paste-btn" id="pasteBtn">粘贴</button>
        <div class="input-wrapper">
          <textarea id="messageInput" placeholder="输入消息..."></textarea>
        </div>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <!-- Modal for merged text display -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">完整文本</div>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-text" id="modalText"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-copy" id="modalCopy">复制</button>
        <button class="modal-btn modal-btn-download" id="modalDownload">下载</button>
      </div>
    </div>
  </div>

  <script src="ggwave/ggwave.js"></script>
  <script>
// Telegram Style Audio Data Transmission

let audioContext = null;
let ggwaveModule = null;
let ggwaveInstance = null;
let isListening = false;
let fastModeEnabled = false;
let captureStream = null;
let sourceNode = null;
let scriptProcessor = null;
let autoSaveEnabled = false;
let incomingBuffer = '';
let incomingTimeout = null;

// Chunk handling for long text
let currentBundleId = '';
let currentChunks = {};
let currentTotalChunks = 0;
let currentReceivedCount = 0;
let bundleTimeout = null;
const CHUNK_TIMEOUT = 10000; // 10 seconds to wait for all chunks
const MAX_CHUNK_SIZE = 30; // Max characters per chunk for audio transmission 数值太大会导致接收出现乱码

function formatTimestamp(now) {
    return '' + now.getFullYear() +
           String(now.getMonth() + 1).padStart(2, '0') +
           String(now.getDate()).padStart(2, '0') +
           String(now.getHours()).padStart(2, '0') +
           String(now.getMinutes()).padStart(2, '0') +
           String(now.getSeconds()).padStart(2, '0');
}

function generateBundleId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function formatSeqNumber(num) {
    return String(num + 1);
}

async function saveMessageToFile(type, text) {
    if (!autoSaveEnabled) return;
    try {
        const timestamp = formatTimestamp(new Date()) + '.txt';
        const blob = new Blob([new Date().toLocaleString() + '] ' + type.toUpperCase() + ': ' + text]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = timestamp;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        console.log('Saved:', timestamp);
    } catch (e) {
        console.error('Save error:', e);
    }
}

const messageInput = document.getElementById('messageInput');
const pasteBtn = document.getElementById('pasteBtn');
const sendBtn = document.getElementById('sendBtn');
const listenBtn = document.getElementById('listenBtn');
const autoSaveBtn = document.getElementById('autoSaveBtn');
const chatArea = document.getElementById('chatArea');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalText = document.getElementById('modalText');
const modalCopy = document.getElementById('modalCopy');
const modalDownload = document.getElementById('modalDownload');
let currentMergedText = '';

// Modal functions
function showModal(text) {
    currentMergedText = text;
    modalText.textContent = text;
    modalOverlay.classList.add('show');
}

function hideModal() {
    modalOverlay.classList.remove('show');
    currentMergedText = '';
}

modalClose.addEventListener('click', hideModal);
modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) {
        hideModal();
    }
});

modalCopy.addEventListener('click', function() {
    navigator.clipboard.writeText(currentMergedText).then(function() {
        modalCopy.textContent = '已复制';
        setTimeout(function() {
            modalCopy.textContent = '复制';
        }, 1000);
    }).catch(function(err) {
        console.error('Copy error:', err);
    });
});

modalDownload.addEventListener('click', function() {
    if (!currentMergedText) return;
    try {
        const timestamp = formatTimestamp(new Date()) + '.txt';
        const blob = new Blob([currentMergedText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = timestamp;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } catch (e) {
        console.error('Download error:', e);
    }
});

function addChatMessage(type, text, seqInfo, isMerged) {
    console.log('addChatMessage: type=' + type + ', isMerged=' + isMerged + ', text length=' + text.length);
    if (seqInfo) console.log('  seqInfo: current=' + seqInfo.current + ', total=' + seqInfo.total);

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar ' + type;
    avatar.textContent = type === 'sent' ? '发' : '收';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    // Add sequence badge for chunks or merged badge
    if (isMerged) {
        const mergedBadge = document.createElement('div');
        mergedBadge.className = 'message-merged-badge';
        mergedBadge.textContent = '已合并 ' + seqInfo.total + ' 片段';
        bubble.appendChild(mergedBadge);
        console.log('  -> Added merged badge');
    } else if (seqInfo && seqInfo.total > 1) {
        const seqBadge = document.createElement('div');
        seqBadge.className = 'message-seq-badge';
        seqBadge.textContent = seqInfo.current + '/' + seqInfo.total;
        bubble.appendChild(seqBadge);
        console.log('  -> Added sequence badge');
    }


    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = new Date().toLocaleTimeString();
    bubble.appendChild(time);

    const content = document.createElement('div');
    content.className = 'message-text';
    content.textContent = text;
    bubble.appendChild(content);

    // For received single chunks (1/1), hide the sequence badge since it's not really chunked
    if (type === 'received' && seqInfo && seqInfo.total === 1) {
        const seqBadge = bubble.querySelector('.message-seq-badge');
        if (seqBadge) {
            seqBadge.remove();
        }
    }

    // Add copy and download buttons for merged messages
    if (isMerged) {
        const actionButtons = document.createElement('div');
        actionButtons.style.cssText = 'display: flex; gap: 6px;margin-top: 8px;';

        const inlineCopyBtn = document.createElement('button');
        inlineCopyBtn.className = 'action-btn';
        inlineCopyBtn.textContent = '复制';
        inlineCopyBtn.style.cssText = 'padding: 4px 8px; font-size: 11px; background: var(--tg-green); color: white;';
        inlineCopyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(text).then(function() {
                inlineCopyBtn.textContent = '已复制';
                setTimeout(function() {
                    inlineCopyBtn.textContent = '复制';
                }, 1000);
            }).catch(function() {});
        });

        const inlineDownloadBtn = document.createElement('button');
        inlineDownloadBtn.className = 'action-btn';
        inlineDownloadBtn.textContent = '下载';
        inlineDownloadBtn.style.cssText = 'padding: 4px 8px; font-size: 11px; background: var(--tg-blue-bg); color: var(--tg-blue);';
        inlineDownloadBtn.addEventListener('click', function() {
            try {
                const timestamp = formatTimestamp(new Date()) + '.txt';
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = timestamp;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Download error:', e);
            }
        });

        actionButtons.appendChild(inlineCopyBtn);
        actionButtons.appendChild(inlineDownloadBtn);
        bubble.appendChild(actionButtons);
        console.log('  -> Added copy and download buttons');
    }

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';
    contentDiv.appendChild(bubble);

    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + type;
    msgDiv.appendChild(avatar);
    msgDiv.appendChild(contentDiv);

    const emptyState = chatArea.querySelector('.empty-state');
    if (emptyState) {
        emptyState.style.display = 'none';
    }

    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;

    saveMessageToFile(type, text);

    while (chatArea.children.length > 101) {
        if (chatArea.children[0] && chatArea.children[0].classList.contains('empty-state')) {
            break;
        }
        chatArea.removeChild(chatArea.children[0]);
    }

    console.log('  -> Message added, scroll to bottom');
}

function convertTypedArray(src, type) {
    const buffer = new ArrayBuffer(src.byteLength);
    new src.constructor(buffer).set(src);
    return new type(buffer);
}

function updateStatus(listening, ready) {
    statusDot.className = 'status-dot';
    if (listening) {
        statusDot.classList.add('listening');
        statusText.textContent = '监听中';
    } else if (ready) {
        statusDot.classList.add('audio-ready');
        statusText.textContent = '已就绪';
    } else {
        statusText.textContent = '未启动';
    }
}

async function initAudio() {
    if (audioContext && ggwaveInstance) return true;
    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
        if (audioContext.state === 'suspended') await audioContext.resume();

        let attempts = 0;
        while (!window.ggwave_factory && attempts < 50) {
            await new Promise(function(r) { setTimeout(r, 100); });
            attempts++;
        }

        if (!window.ggwave_factory) {
            return false;
        }

        ggwaveModule = await window.ggwave_factory();
        await new Promise(function(r) { setTimeout(r, 500); });

        ggwaveInstance = null;
        const parameters = ggwaveModule.getDefaultParameters();
        parameters.sampleRateInp = audioContext.sampleRate;
        parameters.sampleRateOut = audioContext.sampleRate;
        parameters.soundMarkerThreshold = 4;

        for (let i = 0; i < 5; i++) {
            ggwaveInstance = ggwaveModule.init(parameters);
            if (ggwaveInstance) break;
            await new Promise(function(r) { setTimeout(r, 200); });
        }

        if (!ggwaveInstance) {
            return false;
        }

        console.log('Audio ready, sample rate:', audioContext.sampleRate);
        updateStatus(false, true);
        return true;
    } catch (error) {
        console.error('Init error:', error);
        return false;
    }
}

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) {
        return;
    }

    if (!await initAudio()) return;

    try {
        if (isListening) {
            stopListening();
        }

        // Use fast mode settings if enabled
        const chunkSize = MAX_CHUNK_SIZE;
        const protocol = ggwaveModule.ProtocolId.GGWAVE_PROTOCOL_AUDIBLE_FAST;
        const outputVolume = 10;

        // Split text into chunks
        const chunks = [];
        const totalChunks = Math.ceil(text.length / chunkSize);
        console.log('Sending message with ' + totalChunks + ' chunks (fastMode=' + fastModeEnabled + ')');

        for (let i = 0; i < text.length; i += chunkSize) {
            chunks.push(text.substring(i, i + chunkSize));
        }

        // Add header chunk with bundle info (optional for sender display)
        // For audio transmission, we send chunks with position markers in the text itself
        for (let i = 0; i < chunks.length; i++) {
            // Format: [seq/total]content
            const seqPrefix = '[' + formatSeqNumber(i) + '/' + totalChunks + ']';
            const chunkWithSeq = seqPrefix + chunks[i];
            console.log('=== SENDING CHUNK ' + (i + 1) + '/' + totalChunks + ' ===');
            console.log('  Chunk content: "' + chunks[i] + '"');
            console.log('  Full text: "' + chunkWithSeq + '"');
            console.log('  Text length: ' + chunkWithSeq.length);

            const waveform = ggwaveModule.encode(
                ggwaveInstance,
                chunkWithSeq,
                protocol,
                outputVolume
            );
            console.log('  Waveform length: ' + waveform.length);

            const floatData = convertTypedArray(waveform, Float32Array);
            const buffer = audioContext.createBuffer(1, floatData.length, audioContext.sampleRate);
            buffer.getChannelData(0).set(floatData);

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);

            source.start(0);
            console.log('  Playing chunk...');

            await new Promise(function(resolve) { source.onended = resolve; });
            console.log('  Chunk finished');

            if (i < chunks.length - 1) {
                console.log('  Waiting 50ms before next chunk...');
                await new Promise(function(r) { setTimeout(r, 50); });
            }
        }

        // Display as sent message (only show as merged if multiple chunks)
        addChatMessage('sent', text, { current: 1, total: totalChunks }, totalChunks > 1);
        messageInput.value = '';

    } catch (error) {
        console.error('Send error:', error);
    }
}

function parseChunk(chunkText) {
    // Parse format like [1/10]content or [20/100]content
    const match = chunkText.match(/^\[(\d+)\/(\d+)\](.*)$/s);
    if (match) {
        console.log('  -> parseChunk success: seq=' + match[1] + ', total=' + match[2] + ', content=' + match[3].substring(0, 20) + '...');
        return {
            seq: parseInt(match[1], 10),
            total: parseInt(match[2], 10),
            content: match[3]
        };
    }
    console.log('  -> parseChunk FAILED for: ' + chunkText.substring(0, 30) + '...');
    return null;
}

function resetBundleState() {
    console.log('resetBundleState');
    currentBundleId = '';
    currentChunks = {};
    currentTotalChunks = 0;
    currentReceivedCount = 0;
    if (bundleTimeout) {
        clearTimeout(bundleTimeout);
        bundleTimeout = null;
    }
}

function finalizeBundle() {
    console.log('finalizeBundle: total=' + currentTotalChunks + ', received=' + currentReceivedCount);
    if (currentTotalChunks === 0 || currentReceivedCount === 0) {
        resetBundleState();
        return;
    }

    // Merge chunks in order
    let mergedText = '';
    for (let i = 0; i < currentTotalChunks; i++) {
        if (currentChunks[i]) {
            mergedText += currentChunks[i];
        }
    }

    if (mergedText.length > 0) {
        console.log('  -> Merged text length: ' + mergedText.length);
        addChatMessage('received', mergedText, { current: 1, total: currentTotalChunks }, true);
    }

    resetBundleState();
}

async function startListening() {
    if (isListening) {
        stopListening();
        return;
    }

    if (!await initAudio()) return;

    try {
        const constraints = {
            audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, }
        };

        captureStream = await navigator.mediaDevices.getUserMedia(constraints);

        sourceNode = audioContext.createMediaStreamSource(captureStream);
        scriptProcessor = audioContext.createScriptProcessor(1024, 1, 1);

        scriptProcessor.onaudioprocess = function(e) {
            const inputData = e.inputBuffer.getChannelData(0);

            const result = ggwaveModule.decode(
                ggwaveInstance,
                convertTypedArray(new Float32Array(inputData), Int8Array)
            );

            if (result && result.length > 0) {
                console.log('=== AUDIO DECODED === result length: ' + result.length);
                try {
                    let text = new TextDecoder('utf-8').decode(result);
                    console.log('Raw decoded text: "' + text + '"');

                    // Check if text starts with sequence pattern
                    if (!text.startsWith('[')) {
                        // Try to remove prefix if it doesn't start with expected pattern
                        console.log('Text does not start with [, trying to find pattern...');
                        const bracketPos = text.indexOf('[');
                        if (bracketPos > 0 && bracketPos <= text.length / 2) {
                            console.log('Found [ at position ' + bracketPos + ', removing prefix');
                            text = text.substring(bracketPos);
                        }
                    }

                    console.log('Processed text: "' + text + '"');

                    if (text && text.length > 0) {
                        // Try to parse as chunk
                        const chunkInfo = parseChunk(text);

                        if (chunkInfo) {
                            console.log('  -> Chunked message: seq=' + chunkInfo.seq + '/' + chunkInfo.total);
                            clearTimeout(incomingTimeout);

                            // Single chunk - display directly without prefix
                            if (chunkInfo.total === 1) {
                                console.log('  -> Single chunk, displaying directly');
                                addChatMessage('received', chunkInfo.content,
                                    { current: 1, total: 1 }, false);
                                return;
                            }

                            // This is a chunked message (2+ chunks)
                            // Reset bundle if new sequence detected (only when receiving chunk 1)
                            // OR if no active bundle and receiving any chunk (may have missed earlier chunks)
                            const isNewBundle = (chunkInfo.seq === 1 && currentBundleId === '') || (currentBundleId === '' && chunkInfo.seq > 1);
                            console.log('  -> isNewBundle: ' + isNewBundle + ' (chunkSeq=' + chunkInfo.seq + ', currentBundleId=' + currentBundleId + ', currentReceivedCount=' + currentReceivedCount + ')');

                            if (isNewBundle) {
                                finalizeBundle();
                                currentBundleId = generateBundleId();
                                currentTotalChunks = chunkInfo.total;
                                currentReceivedCount = 0;
                                currentChunks = {};
                                console.log('  -> Started new bundle, total chunks: ' + currentTotalChunks);

                                // If we missed earlier chunks, start collecting from current one
                                if (chunkInfo.seq > 1) {
                                    console.log('  -> Note: Started from chunk ' + chunkInfo.seq + ', may have missed earlier chunks');
                                }
                            }

                            if (currentTotalChunks > 0 && chunkInfo.seq <= currentTotalChunks) {
                                // Store chunk (convert 1-based to 0-based index)
                                const chunkIndex = chunkInfo.seq - 1;

                                if (!currentChunks[chunkIndex]) {
                                    currentChunks[chunkIndex] = chunkInfo.content;
                                    currentReceivedCount++;
                                    console.log('  -> Stored chunk ' + chunkInfo.seq + ', received ' + currentReceivedCount + '/' + currentTotalChunks);

                                    // Display individual chunk with sequence number
                                    addChatMessage('received', chunkInfo.content,
                                        { current: chunkInfo.seq, total: chunkInfo.total }, false);

                                    // Check if all chunks received
                                    if (currentReceivedCount >= currentTotalChunks) {
                                        console.log('  -> All chunks received, will finalize in 200ms');
                                        clearColorTimeout(bundleTimeout);
                                        bundleTimeout = setTimeout(finalizeBundle, 200);
                                    } else {
                                        // Reset timeout to wait for remaining chunks
                                        if (bundleTimeout) clearTimeout(bundleTimeout);
                                        bundleTimeout = setTimeout(finalizeBundle, CHUNK_TIMEOUT);
                                        console.log('  -> Waiting for more chunks, timeout in ' + CHUNK_TIMEOUT + 'ms');
                                    }
                                } else {
                                    console.log('  -> Chunk ' + chunkInfo.seq + ' already received, skipping');
                                }
                            }
                        } else {
                            // Single chunk or unchunked message
                            console.log('  -> Single/unchunked message');
                            clearTimeout(incomingTimeout);

                            incomingBuffer += text;
                            clearTimeout(incomingTimeout);

                            incomingTimeout = setTimeout(function() {
                                if (incomingBuffer) {
                                    finalizeBundle(); // Finalize any pending bundle first
                                    addChatMessage('received', incomingBuffer, { current: 1, total: 1 }, false);
                                    incomingBuffer = '';
                                }
                            }, 150);
                        }
                    }
                } catch (err) {
                    console.error('Decode error:', err);
                }
            }
        };

        const muteGain = audioContext.createGain();
        muteGain.gain.value = 0;
        sourceNode.connect(scriptProcessor);
        scriptProcessor.connect(muteGain);
        muteGain.connect(audioContext.destination);

        isListening = true;
        listenBtn.textContent = '停止';
        listenBtn.classList.add('active');
        updateStatus(true, true);

    } catch (error) {
        console.error('Listen error:', error);
        isListening = false;
    }
}

function stopListening() {
    if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor.onaudioprocess = null;
        scriptProcessor = null;
    }

    if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
    }

    if (captureStream) {
        captureStream.getTracks().forEach(function(track) { track.stop(); });
        captureStream = null;
    }

    isListening = false;
    listenBtn.textContent = '监听';
    listenBtn.classList.remove('active');
    updateStatus(false, true);
}

function toggleAutoSave() {
    autoSaveEnabled = !autoSaveEnabled;
    autoSaveBtn.classList.toggle('active', autoSaveEnabled);
    autoSaveBtn.textContent = autoSaveEnabled ? '保存日志: 开' : '保存日志: 关';
}

pasteBtn.addEventListener('click', async function() {
    try {
        const text = await navigator.clipboard.readText();
        messageInput.value = text;
    } catch (err) {
    }
});

sendBtn.addEventListener('click', sendMessage);
listenBtn.addEventListener('click', startListening);
autoSaveBtn.addEventListener('click', toggleAutoSave);


document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
    if (e.key === 'Escape' && isListening) {
        stopListening();
    }
    if (e.key === 'Escape') {
        hideModal();
    }
});

initAudio();

  </script>
</body>
</html>
